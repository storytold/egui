# Looks for unused crates.
name: Cargo Shear

on:
  push:
    branches:
      - "main"
  pull_request:
    types: [opened, synchronize]

jobs:
  cargo-shear:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Install Cargo Shear
        uses: step-security/taiki-e-install-action@v2.87.32
        with:
          tool: cargo-shear@1.11.2

      - name: Run Cargo Shear
        run: |
          cargo shear
