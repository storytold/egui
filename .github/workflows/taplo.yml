# Checks that all TOML files are formatted with taplo.
name: Taplo

on:
  push:
    branches:
      - "main"
  pull_request:
    types: [opened, synchronize]

jobs:
  taplo:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Install Taplo
        uses: step-security/taiki-e-install-action@v2.87.32
        with:
          tool: taplo-cli@0.9.3

      - name: Check TOML formatting
        run: |
          taplo fmt --check
