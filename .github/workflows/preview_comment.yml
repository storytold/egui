name: preview_comment.yml
on:
  pull_request_target:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Comment PR
        uses: step-security/actions-comment-pull-request@60cd38988a354b2d22b47612fb02a20e822d6048 # v3.0.2
        env:
          URL_SLUG: ${{ github.event.number }}-${{ github.head_ref }}
        with:
          message: |
            Preview is being built...
            
            Preview will be available at https://egui-pr-preview.github.io/pr/${{ env.URL_SLUG }}
            
            View snapshot changes at [kitdiff](https://rerun-io.github.io/kitdiff/?url=${{ github.event.pull_request.html_url }})
          comment-tag: 'egui-preview'

